<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velaria</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     CONFIGURE YOUR MAP HERE
     ============================================================ */
  :root { --tile-size: 256; }
</style>

<style>
  :root {
    --ink:        #14171f;
    --ink-panel:  #1c2130;
    --ink-line:   #2c3346;
    --parchment:  #ece0c4;
    --parchment-dim: #a9a08a;
    --brass:      #c9a54b;
    --brass-dim:  #8a713a;
    --crimson:    #a5453f;
    --forest:     #4f7a55;
    --slate:      #5b7189;
    --plum:       #7a5a8c;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--ink);
    color: var(--parchment);
    overflow: hidden;
  }

  #map {
    position: absolute;
    inset: 0;
    background: #0c0e13;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: absolute;
    top: 16px; left: 16px; right: 16px;
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 12px;
    pointer-events: none;
  }
  .brand {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.04em;
    color: var(--brass);
    background: var(--ink-panel);
    border: 1px solid var(--ink-line);
    padding: 10px 16px;
    border-radius: 8px;
    pointer-events: auto;
    white-space: nowrap;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
  }
  .search-wrap {
    flex: 1;
    max-width: 360px;
    pointer-events: auto;
    position: relative;
  }
  .search-wrap input {
    width: 100%;
    background: var(--ink-panel);
    border: 1px solid var(--ink-line);
    color: var(--parchment);
    padding: 11px 14px;
    border-radius: 8px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
  }
  .search-wrap input::placeholder { color: var(--parchment-dim); }
  .search-wrap input:focus { outline: 2px solid var(--brass); outline-offset: -1px; }

  .search-results {
    position: absolute;
    top: calc(100% + 6px);
    left: 0; right: 0;
    background: var(--ink-panel);
    border: 1px solid var(--ink-line);
    border-radius: 8px;
    overflow: hidden;
    max-height: 260px;
    overflow-y: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.45);
  }
  .search-results button {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    text-align: left;
    padding: 9px 12px;
    background: none;
    border: none;
    border-bottom: 1px solid var(--ink-line);
    color: var(--parchment);
    cursor: pointer;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
  }
  .search-results button:last-child { border-bottom: none; }
  .search-results button:hover { background: rgba(201,165,75,0.12); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; vertical-align: middle; }

  /* ---------- Add-pin mode toggle ---------- */
  .add-toggle {
    pointer-events: auto;
    background: var(--ink-panel);
    border: 1px solid var(--ink-line);
    color: var(--parchment);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    padding: 11px 16px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    transition: background 0.15s, color 0.15s;
  }
  .add-toggle.active {
    background: var(--brass);
    color: var(--ink);
    border-color: var(--brass);
  }

  /* ---------- Edit-mode lock + gated controls ---------- */
  .lock-btn {
    pointer-events: auto;
    background: var(--ink-panel);
    border: 1px solid var(--ink-line);
    color: var(--parchment-dim);
    width: 42px; height: 42px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    flex-shrink: 0;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
  }
  .lock-btn.unlocked { color: var(--brass); border-color: var(--brass); }
  .edit-only { display: none !important; }
  body.edit-mode .edit-only { display: initial !important; }
  body.edit-mode .sidebar-footer.edit-only { display: flex !important; }
  body.edit-mode .sidebar-tabs.edit-only { display: flex !important; }
  /* the shape-drawing panel only shows while a shape is actually being drawn */
  body.edit-mode .draw-panel.edit-only { display: none !important; }
  body.edit-mode .draw-panel.edit-only.open { display: block !important; }
  .readonly-note { padding: 14px 16px; font-size: 12px; color: var(--parchment-dim); line-height: 1.5; }
  body.edit-mode .readonly-note { display: none !important; }

  /* ---------- Sidebar (pin list) ---------- */
  .sidebar {
    position: absolute;
    top: 76px; right: 16px; bottom: 16px;
    width: 280px;
    background: var(--ink-panel);
    border: 1px solid var(--ink-line);
    border-radius: 10px;
    z-index: 999;
    display: flex;
    flex-direction: column;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    transition: transform 0.2s ease;
  }
  .sidebar.collapsed { transform: translateX(calc(100% + 16px)); } /* slides off, leaving the labelled tab showing */
  .sidebar-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--ink-line);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .sidebar-header h2 {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.03em;
    margin: 0;
    color: var(--brass);
  }
  .sidebar-tabs { display: flex; border-bottom: 1px solid var(--ink-line); flex-shrink: 0; }
  .tab-btn {
    flex: 1; padding: 9px 4px; background: none; border: none;
    color: var(--parchment-dim); font-family: 'Inter', sans-serif;
    font-size: 12px; font-weight: 600; cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .tab-btn.active { color: var(--brass); border-bottom-color: var(--brass); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .faction-row {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 8px; border-radius: 7px;
  }
  .faction-row:hover { background: rgba(201,165,75,0.06); }
  .faction-row input[type=checkbox] { accent-color: var(--brass); flex-shrink: 0; }
  .faction-row input[type=color] {
    width: 22px; height: 22px; padding: 0; border: 1px solid var(--ink-line);
    border-radius: 5px; background: none; cursor: pointer; flex-shrink: 0;
  }
  .faction-row .faction-name { flex: 1; font-size: 12.5px; }
  .faction-filter-actions {
    display: flex; gap: 8px; padding: 4px 8px 10px;
  }
  .faction-filter-actions button {
    flex: 1; background: var(--ink); border: 1px solid var(--ink-line);
    color: var(--parchment-dim); font-size: 11px; font-weight: 600;
    padding: 6px; border-radius: 6px; cursor: pointer;
  }
  .faction-filter-actions button:hover { border-color: var(--brass); color: var(--brass); }

  .faction-group-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 8px 4px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--brass);
  }
  .faction-group-head .fav-reset {
    background: none; border: 1px solid var(--ink-line); color: var(--parchment-dim);
    font-size: 10px; padding: 2px 8px; border-radius: 10px; cursor: pointer; text-transform: none; letter-spacing: 0;
  }
  .faction-group-head .fav-reset:hover { border-color: var(--brass); color: var(--brass); }
  .fav-btn {
    background: none; border: 0; cursor: pointer; font-size: 18px; line-height: 1;
    color: var(--parchment-dim); padding: 4px 6px; margin: -4px -4px -4px 0; border-radius: 6px; flex-shrink: 0;
  }
  .fav-btn:hover { color: var(--brass); background: rgba(201,165,75,0.1); }
  .fav-btn.on { color: var(--brass); }

  /* ---------- Territory drawing panel ---------- */
  .draw-panel {
    position: absolute;
    top: 76px; left: 16px; z-index: 999;
    width: 220px;
    background: var(--ink-panel);
    border: 1px solid var(--ink-line);
    border-radius: 10px;
    padding: 14px 16px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
  }
  .draw-panel label { display: block; font-size: 11px; color: var(--parchment-dim); margin-bottom: 5px; }
  .draw-panel select {
    width: 100%; background: var(--ink); border: 1px solid var(--ink-line);
    color: var(--parchment); padding: 7px 8px; border-radius: 6px;
    font-family: 'Inter', sans-serif; font-size: 12.5px; margin-bottom: 10px; cursor: pointer;
  }
  .draw-status { font-size: 12px; color: var(--parchment-dim); margin-bottom: 10px; }
  .draw-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .draw-actions button {
    flex: 1; min-width: 62px; background: var(--ink); border: 1px solid var(--ink-line);
    color: var(--parchment); font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600;
    padding: 7px 4px; border-radius: 6px; cursor: pointer;
  }
  .draw-actions button:hover { border-color: var(--brass); color: var(--brass); }
  #finishPolygonBtn:disabled { opacity: 0.4; cursor: default; }
  #finishPolygonBtn:disabled:hover { border-color: var(--ink-line); color: var(--parchment); }

  .territory-row {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 8px; border-radius: 7px;
  }
  .territory-row:hover { background: rgba(201,165,75,0.06); }
  .territory-row .swatch { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }

  /* Faction logos: small icon beside names, and the territory watermark */
  .mini-slot { display: inline-flex; width: 18px; height: 18px; flex-shrink: 0; align-items: center; justify-content: center; }
  .mini-logo { width: 18px; height: 18px; object-fit: contain; background: #e9dfc4; border-radius: 4px; padding: 1px; }
  .popup-logo { width: 18px; height: 18px; object-fit: contain; vertical-align: middle; margin-right: 6px; background: #e9dfc4; border-radius: 4px; padding: 1px; }
  .territory-logo { pointer-events: none; opacity: var(--wm-opacity, 0.4); }
  .territory-logo img {
    width: 100%; height: 100%; object-fit: contain; display: block;
    /* light halo so the dark emblem stays readable on dark or busy map areas */
    filter: drop-shadow(0 0 1px rgba(255,255,255,0.9)) drop-shadow(0 0 3px rgba(255,255,255,0.6));
  }

  .layer-toggles {
    display: flex; flex-wrap: wrap; gap: 8px 14px; padding: 10px 8px 8px;
    border-bottom: 1px solid var(--ink-line); margin-bottom: 6px;
  }
  .layer-toggles label {
    display: flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 600; color: var(--parchment); cursor: pointer;
  }
  .layer-toggles input[type=checkbox] { accent-color: var(--brass); }
  .sidebar-sub { font-size: 11px; color: var(--parchment-dim); margin-top: 3px; line-height: 1.3; }
  .sidebar-toggle {
    position: absolute;
    top: 50%; left: -38px;
    transform: translateY(-50%);
    width: 38px; height: 148px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    padding: 0;
    background: var(--ink-panel);
    border: 1px solid var(--ink-line);
    border-right: none;
    border-radius: 8px 0 0 8px;
    color: var(--brass);
    cursor: pointer;
    font-size: 14px;
    box-shadow: -4px 6px 14px rgba(0,0,0,0.3);
  }
  .sidebar-toggle .st-arrow { font-size: 18px; line-height: 1; }
  .sidebar-toggle .st-label {
    writing-mode: vertical-rl; font-family: 'Inter', sans-serif; font-size: 12px;
    font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .sidebar-toggle:hover { background: var(--brass); color: var(--ink); }
  .pin-list { flex: 1; overflow-y: auto; padding: 8px; }
  .pin-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 9px 8px;
    border-radius: 7px;
    cursor: pointer;
  }
  .pin-row:hover { background: rgba(201,165,75,0.1); }
  .pin-row .dot { margin-top: 4px; }
  .pin-row-text { flex: 1; min-width: 0; }
  .pin-row-name { font-size: 13.5px; font-weight: 600; }
  .pin-row-cat { font-size: 11px; color: var(--parchment-dim); text-transform: uppercase; letter-spacing: 0.04em; }
  .pin-row-del {
    background: none; border: none; color: var(--parchment-dim);
    cursor: pointer; font-size: 15px; padding: 2px 6px; line-height: 1;
  }
  .pin-row-del:hover { color: var(--crimson); }
  .empty-note { padding: 20px 12px; color: var(--parchment-dim); font-size: 13px; line-height: 1.5; }

  .sidebar-footer {
    padding: 10px 12px;
    border-top: 1px solid var(--ink-line);
    display: flex;
    gap: 8px;
  }
  .sidebar-footer button {
    flex: 1;
    background: var(--ink);
    border: 1px solid var(--ink-line);
    color: var(--parchment);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    padding: 8px 6px;
    border-radius: 6px;
    cursor: pointer;
  }
  .sidebar-footer button:hover { border-color: var(--brass); color: var(--brass); }

  /* ---------- Pin marker (custom divIcon) ---------- */
  /* Leaflet already positions this box via iconAnchor (see pinIcon()) —
     no extra transform here. (Adding one on top was the old zoom-drift
     bug: it applied a second, fixed-screen-pixel offset in addition to
     Leaflet's own anchor offset, so the visual position slid relative
     to the map as the map's scale-per-pixel changed with zoom.) */
  .map-pin {
    width: 34px; height: 43px;
    display: flex; align-items: flex-start; justify-content: center;
    position: relative;
  }
  /* Leaflet's own CSS gives every <svg> inside the map z-index 200, which
     would paint the pin's teardrop over its badge — so set explicit
     stacking: teardrop at 0, badge above it. */
  .map-pin svg { width: 34px; height: 43px; filter: drop-shadow(0 3px 5px rgba(0,0,0,0.5)); z-index: 0; }
  /* Cream badge in the pin head holds the faction logo; if the logo file
     is missing the image hides itself and the faction's initial shows. */
  .pin-badge {
    position: absolute; left: 50%; top: 16.8px;
    width: 22px; height: 22px; transform: translate(-50%, -50%);
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; z-index: 5;
  }
  .pin-badge .pin-logo { width: 18px; height: 18px; object-fit: contain; }
  .pin-badge .pin-letter { display: none; font-size: 13px; font-weight: 700; color: var(--ink); }
  .pin-badge.no-logo .pin-letter { display: block; }
  .map-pin .label {
    position: absolute;
    top: 45px; left: 50%; transform: translateX(-50%);
    white-space: nowrap;
    font-size: 11px; font-weight: 600;
    color: var(--parchment);
    background: rgba(20,23,31,0.82);
    padding: 2px 7px;
    border-radius: 4px;
    pointer-events: none;
    text-shadow: 0 1px 1px rgba(0,0,0,0.5);
  }

  /* ---------- Popup ---------- */
  .leaflet-popup-content-wrapper {
    background: var(--ink-panel);
    color: var(--parchment);
    border: 1px solid var(--ink-line);
    border-radius: 8px;
  }
  .leaflet-popup-tip { background: var(--ink-panel); }
  .leaflet-popup-content { margin: 12px 14px; font-family: 'Inter', sans-serif; }
  .popup-title { font-family: 'Cinzel', serif; font-weight: 700; font-size: 15px; color: var(--brass); margin-bottom: 2px; }
  .popup-cat { font-size: 11px; color: var(--parchment-dim); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; }
  .popup-notes { font-size: 13px; line-height: 1.5; white-space: pre-wrap; margin-bottom: 10px; }
  .popup-actions { display: flex; gap: 8px; }
  .popup-edit { background: none; border: 1px solid var(--ink-line); color: var(--brass); font-size: 12px; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
  .popup-edit:hover { background: rgba(201,165,75,0.12); }
  .popup-del { background: none; border: 1px solid var(--ink-line); color: var(--crimson); font-size: 12px; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
  .popup-del:hover { background: rgba(165,69,63,0.15); }

  /* ---------- New pin form modal ---------- */
  .modal-backdrop {
    position: absolute; inset: 0; background: rgba(10,12,17,0.55);
    z-index: 2000; display: flex; align-items: center; justify-content: center;
  }
  .modal {
    background: var(--ink-panel);
    border: 1px solid var(--ink-line);
    border-radius: 10px;
    width: 320px;
    padding: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  .modal h3 {
    font-family: 'Cinzel', serif; color: var(--brass); font-size: 16px; margin: 0 0 14px;
  }
  .modal label { display: block; font-size: 12px; color: var(--parchment-dim); margin: 12px 0 5px; }
  .modal input[type=text], .modal textarea {
    width: 100%; background: var(--ink); border: 1px solid var(--ink-line);
    color: var(--parchment); padding: 8px 10px; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 13px;
  }
  .modal textarea { resize: vertical; min-height: 60px; }
  .modal select {
    width: 100%; background: var(--ink); border: 1px solid var(--ink-line);
    color: var(--parchment); padding: 8px 10px; border-radius: 6px;
    font-family: 'Inter', sans-serif; font-size: 13px; cursor: pointer;
  }
  .modal select:focus { outline: 2px solid var(--brass); outline-offset: -1px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 18px; }
  .modal-actions button {
    flex: 1; padding: 9px; border-radius: 6px; font-family: 'Inter', sans-serif;
    font-weight: 600; font-size: 13px; cursor: pointer; border: 1px solid var(--ink-line);
  }
  .btn-save { background: var(--brass); color: var(--ink); border-color: var(--brass); }
  .btn-cancel { background: none; color: var(--parchment-dim); }

  /* ---------- Leaflet control overrides ---------- */
  .leaflet-control-zoom { display: none; } /* replaced by compass control */
  .compass {
    position: absolute; bottom: 20px; left: 16px; z-index: 999;
    width: 64px; height: 64px; cursor: pointer;
  }
  .compass button {
    position: absolute; background: var(--ink-panel); border: 1px solid var(--ink-line);
    color: var(--brass); width: 26px; height: 26px; border-radius: 50%;
    font-size: 14px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.35);
  }
  .compass button:hover { background: var(--brass); color: var(--ink); }
  .compass .zin  { top: 0; left: 19px; }
  .compass .zout { bottom: 0; left: 19px; }
  .compass .reset { top: 19px; left: 19px; }

  /* ---------- Rotate controls (sit just above the zoom compass) ---------- */
  .rotate-ctl {
    position: absolute; bottom: 92px; left: 16px; z-index: 999;
    display: flex; gap: 6px; align-items: center;
  }
  .rotate-ctl button {
    background: var(--ink-panel); border: 1px solid var(--ink-line);
    color: var(--brass); width: 26px; height: 26px; border-radius: 50%;
    font-size: 15px; line-height: 1; cursor: pointer; padding: 0;
    box-shadow: 0 4px 10px rgba(0,0,0,0.35);
    display: flex; align-items: center; justify-content: center;
  }
  .rotate-ctl button:hover { background: var(--brass); color: var(--ink); }
  .rotate-ctl .north { width: 32px; height: 32px; }
  .rotate-ctl .north svg { width: 18px; height: 18px; transition: transform 0.12s linear; }


  /* ---------- Layers shortcut (bottom-left, beside the zoom keys) ---------- */
  .layers-ctl { position: absolute; bottom: 20px; left: 92px; z-index: 1000; }
  .layers-btn {
    width: 72px; height: 64px; border-radius: 14px; cursor: pointer;
    background: var(--ink-panel); border: 2px solid var(--brass); color: var(--brass);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.02em;
    box-shadow: 0 6px 16px rgba(0,0,0,0.45); padding: 0;
  }
  .layers-btn svg { width: 28px; height: 28px; }
  .layers-btn:hover, .layers-btn[aria-expanded="true"] { background: var(--brass); color: var(--ink); }
  .layers-panel {
    position: absolute; bottom: 76px; left: 28px; width: 248px;
    background: var(--ink-panel); border: 1px solid var(--ink-line); border-radius: 12px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.5); padding: 8px;
  }
  .layers-panel[hidden] { display: none; }
  .layers-panel h4 {
    margin: 4px 8px 6px; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--parchment-dim);
  }
  .layer-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%; min-height: 48px; padding: 6px 10px; border-radius: 8px; cursor: pointer;
    background: none; border: 0; color: var(--parchment); font-family: 'Inter', sans-serif;
    font-size: 15px; font-weight: 600; text-align: left;
  }
  .layer-row:hover { background: rgba(255,255,255,0.06); }
  .layer-row.sub { padding-left: 26px; font-weight: 500; font-size: 14px; }
  .layer-row.disabled { opacity: 0.4; pointer-events: none; }
  .layer-switch {
    flex: none; width: 40px; height: 22px; border-radius: 11px; position: relative;
    background: var(--ink-line); transition: background 0.15s;
  }
  .layer-switch::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
    border-radius: 50%; background: var(--parchment-dim); transition: left 0.15s, background 0.15s;
  }
  .layer-row[aria-checked="true"] .layer-switch { background: var(--brass-dim); }
  .layer-row[aria-checked="true"] .layer-switch::after { left: 21px; background: var(--brass); }

  .hint {
    position: absolute; bottom: 20px; left: 176px; z-index: 999;
    background: var(--ink-panel); border: 1px solid var(--ink-line);
    color: var(--parchment-dim); font-size: 12px; padding: 8px 12px;
    border-radius: 7px; pointer-events: none; opacity: 0; transition: opacity 0.2s;
  }
  .hint.show { opacity: 1; }

  .draw-controls {
    position: absolute; bottom: 20px; left: 176px; z-index: 1001;
    background: var(--ink-panel); border: 1px solid var(--ink-line);
    border-radius: 7px; padding: 8px 10px; display: none; align-items: center; gap: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
  }
  .draw-controls.show { display: flex; }
  .draw-controls span { font-size: 12px; color: var(--parchment-dim); margin-right: 4px; }
  .draw-controls button {
    background: var(--ink); border: 1px solid var(--ink-line); color: var(--parchment);
    font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600;
    padding: 6px 10px; border-radius: 6px; cursor: pointer;
  }
  .draw-controls button:hover { border-color: var(--brass); color: var(--brass); }
  .draw-controls .btn-finish { background: var(--brass); color: var(--ink); border-color: var(--brass); }
</style>
</head>
<body>

<div id="map"></div>

<div class="topbar">

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<!-- leaflet-rotate: adds map rotation (bearing) to Leaflet. Must load after Leaflet, before the map is created. -->
<script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>
<script>
/* ================================================================
   1. MAP CONFIGURATION — edit these four values for your own map
   ================================================================
   After tiling your PNG (see the instructions below the code),
   fill in:
   - TILE_URL: path to your tile folder, using {z}/{x}/{y}.png
   - IMAGE_WIDTH / IMAGE_HEIGHT: pixel dimensions of the ORIGINAL,
     untiled PNG (not the tile folder size)
   - MAX_NATIVE_ZOOM: the highest zoom folder gdal2tiles created
     (e.g. if it made folders 0,1,2,3,4,5 then this is 5)
   ================================================================ */
  const TILE_URL        = "tiles/{z}/{x}/{y}.png";
  const IMAGE_WIDTH      = 14108;   // px — replace with your map's width
  const IMAGE_HEIGHT     = 9893;   // px — replace with your map's height
  const MAX_NATIVE_ZOOM  = 6;      // replace with your tiler's max zoom folder
  const MIN_ZOOM         = 0;
  const MAX_ZOOM         = MAX_NATIVE_ZOOM + 2; // allow a bit of over-zoom

  // PINS_URL: a JSON file sitting next to this page that everyone's
  // browser fetches on load — this is the shared, public pin layer.
  const PINS_URL = "pins.json";
  // EDIT_PASSPHRASE: hides the editing controls from casual visitors.
  // NOTE: this is a convenience, not real security — anyone can view
  // this file's source and read the passphrase. Real access control
  // is that only you can publish a new pins.json to your host.
  const EDIT_PASSPHRASE = "Velaria";

  // FACTION LOGOS: each faction can have an emblem file in the logos/
  // folder, named after the faction — lower case, apostrophes dropped,
  // everything else turned into hyphens — e.g. "Rippy Joe's Slicers"
  // → logos/rippy-joes-slicers.svg  (see logos/FILENAMES.txt).
  // Missing files are fine: that faction just shows its initial on pins
  // and no watermark.
  const LOGO_FOLDER = "logos/";
  const LOGO_EXT = "svg";          // change to "png" if your logos are PNG files
  const WATERMARK_OPACITY = 0.45;  // 0–1, strength of the logo on territories
  const WATERMARK_MIN_PX = 30;     // hide the watermark if it would be smaller than this on screen
  const WATERMARK_MAX_PX = 120;    // never draw it larger than this
  document.documentElement.style.setProperty('--wm-opacity', WATERMARK_OPACITY);

  // FACTIONS: master list of factions and each one's marker colour.
  // Tagging a pin with a faction is optional. To add, remove, rename,
  // or recolour a faction, just edit this list — the name is what's
  // stored on each pin, so renaming a key here will "orphan" any pin
  // already tagged with the old name (it'll show as unassigned).
  const FACTIONS_DEFAULT = {
    "Poldergeists": "#043004",
    "Underlane Bank": "#2a30d1",
    "Bronze Crows": "#393e6e",
    "Rippy Joe's Slicers": "#c76641",
    "The Cutpurse Crew": "#be682c",
    "Blackwater Sirens": "#080b0d",
    "Baron Sand": "#d0a038",
    "The Deadman's Doors": "#b59e34",
    "The Dock 3 Lads": "#d0c938",
    "The Mudbay Stags": "#bbc741",
    "The Crystal Cutters": "#9cbe2c",
    "The Maskers": "#96c741",
    "The Loopers": "#84d038",
    "Backyard Briscoes": "#42eff5",
    "Westend Skinners": "#f5ef42",
    "The Gimlets": "#661755",
    "Oxbow Holdings": "#b07c1c",
    "The Musician's Guild": "#eaa5f0",
    "Noctal Song": "#5bd038",
    "The Scattered League": "#4dc741",
    "The Glimmershade Syndicate": "#2cbe33",
    "The Dusty Gals": "#ab06d4",
    "Red Pilgrims": "#f70a3d",
    "Velarian Army": "#38d069",
    "The Guilds Mercantile": "#34b56f",
    "Navy of the Republic": "#38d092",
    "Purple Lotus Guild": "#9336ad",
    "Guild of St Gregor": "#2cbeaa",
    "Khalmara Guild": "#41c7c7",
    "Noble College of Bankers": "#38bbd0",
    "Fort Izle Prison": "#3492b5",
    "Church of Alastor": "#3892d0",
    "Broken Tower Guild": "#417ec7",
    "Culcainian Consulate": "#2c5abe",
    "Library of Velaria": "#4159c7",
    "Star Sea Trading Company": "#383fd0",
    "Ostral Song": "#4034b5",
    "Zantish Embassy": "#5b38d0",
    "Evenstorm Consulate": "#7241c7",
    "Amarantan Embassy": "#752cbe",
    "Sailors": "#9641c7",
    "Ferrymen": "#54493d",
    "Stonecutters": "#aa34b5",
    "Polderfolk": "#d038c9",
    "Underwriters": "#c741af",
    "Vintners": "#be2c8f",
    "Chandlers": "#c7418a",
    "Shipwrights": "#d03876",
    "Scriveners": "#b53457",
    "Kirkmuir Mechanistic": "#d0384d",
  };
  const NO_FACTION_COLOR = "#8a93a6"; // marker colour for pins with no faction tagged

  // factionColors is the live, editable copy — starts from the defaults
  // above, then gets overridden by whatever's saved in pins.json (see
  // loadPins) so that colour changes made via the Factions panel persist
  // once published.
  let factionColors = Object.assign({}, FACTIONS_DEFAULT);

/* ================================================================
   2. MAP SETUP (CRS.Simple — plain pixel coordinates, no geo data)
   ================================================================ */
  const map = L.map('map', {
    crs: L.CRS.Simple,
    minZoom: MIN_ZOOM,
    maxZoom: MAX_ZOOM,
    zoomControl: false,
    attributionControl: false,
    // Rotation (leaflet-rotate). Rotate with the on-screen buttons, or
    // Shift + scroll wheel on desktop. Two-finger twist is deliberately
    // OFF: on a phone, fingers twist slightly during every pinch-zoom, which
    // spun the map by accident and also stopped territory shapes scaling
    // until the fingers lifted. The plugin's own control is off — we use ours.
    rotate: true,
    bearing: 0,
    touchRotate: false,
    shiftKeyRotate: true,
    rotateControl: false,
  });

  // Compute the pixel bounds of the image at native resolution,
  // then convert to Leaflet's unprojected coordinate space.
  const southWest = map.unproject([0, IMAGE_HEIGHT], MAX_NATIVE_ZOOM);
  const northEast = map.unproject([IMAGE_WIDTH, 0], MAX_NATIVE_ZOOM);
  const bounds = L.latLngBounds(southWest, northEast);

  L.tileLayer(TILE_URL, {
    minZoom: MIN_ZOOM,
    maxZoom: MAX_ZOOM,
    maxNativeZoom: MAX_NATIVE_ZOOM,
    noWrap: true,
    bounds: bounds,
    tileSize: 256,
    errorTileUrl: "",
  }).addTo(map);

  map.setMaxBounds(bounds.pad(0.5));
  map.fitBounds(bounds);

/* ================================================================
   3. PIN ICON FACTORY
   ================================================================ */
  // --- Faction logo helpers ---
  function factionSlug(name) {
    return (name || '').toLowerCase().replace(/['’]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }
  function logoSrc(faction) {
    return LOGO_FOLDER + factionSlug(faction) + '.' + LOGO_EXT;
  }
  // Called by an <img>'s onerror: hide it and flag its parent so CSS can
  // show a fallback (e.g. the faction's initial on a pin).
  function logoMissing(img) {
    img.onerror = null;
    img.style.display = 'none';
    if (img.parentElement) img.parentElement.classList.add('no-logo');
  }
  function logoImg(faction, cls) {
    if (!faction) return '';
    return `<img class="${cls}" src="${logoSrc(faction)}" alt="" draggable="false" onerror="logoMissing(this)">`;
  }

  function pinIcon(faction, name) {
    const color = (faction && factionColors[faction]) || NO_FACTION_COLOR;
    const letter = faction ? faction.charAt(0).toUpperCase() : '';
    // Pins with a faction get a cream badge in the head for the logo.
    const badge = faction ? `<circle cx="15" cy="14.8" r="10.2" fill="#f3ead2" stroke="#14171f" stroke-width="1"/>` : '';
    return L.divIcon({
      className: '',
      html: `<div class="map-pin">
               <svg viewBox="0 0 30 38"><path fill="${color}" stroke="#14171f" stroke-width="1.5"
                 d="M15 1C7.3 1 1 7.2 1 14.8 1 25 15 37 15 37s14-12 14-22.2C29 7.2 22.7 1 15 1z"/>${badge}</svg>
               ${faction ? `<div class="pin-badge"><span class="pin-letter">${escapeHtml(letter)}</span>${logoImg(faction, 'pin-logo')}</div>` : ''}
               <div class="label">${escapeHtml(name)}</div>
             </div>`,
      iconSize: [34, 43],
      iconAnchor: [17, 43],
      popupAnchor: [0, -39],
    });
  }

/* ================================================================
   4. PERSISTENCE — everyone's browser fetches pins.json on load;
   that's the shared, published pin layer. While in edit mode your
   changes live in memory (backed up to localStorage so a refresh
   doesn't lose unpublished work) until you click "Publish pins.json"
   and replace that file on your host.
   ================================================================ */
  const DRAFT_KEY = "citymap.draft.v1";
  const FILTER_KEY = "citymap.filters.v1"; // per-browser faction visibility choices
  // Layer visibility is deliberately NOT remembered between visits: every load starts with
  // pins off and territories on, so the map opens uncluttered for everyone.
  const FAV_KEY = "citymap.favs.v1"; // per-browser favourite tweaks: { add: [...], remove: [...] }
  // Factions pinned to the top of the Faction filter for everybody. pins.json can carry its own
  // "favourites" list, which wins over this one (this is only the fallback until you publish one).
  const FAVOURITES_FALLBACK = ["Poldergeists", "Underlane Bank", "The Loopers", "Velarian Army",
    "Oxbow Holdings", "The Dusty Gals", "The Musician's Guild", "Blackwater Sirens"];
  let defaultFavs = FAVOURITES_FALLBACK.slice();
  // How the non-favourite factions are grouped in the Faction filter. Names must match FACTIONS_DEFAULT
  // exactly; anything not listed here (e.g. a faction you add later) lands in an "Other" group at the bottom.
  const FACTION_GROUPS = [
    ["Underworld Factions", ["Poldergeists", "Underlane Bank", "The Loopers", "Blackwater Sirens", "The Dusty Gals",
      "Bronze Crows", "Rippy Joe's Slicers", "Baron Sand", "The Deadman's Doors", "The Dock 3 Lads", "The Mudbay Stags",
      "The Crystal Cutters", "The Maskers", "Backyard Briscoes", "Westend Skinners", "The Gimlets",
      "The Glimmershade Syndicate", "The Cutpurse Crew"]],
    ["Institutions", ["The Guilds Mercantile", "Navy of the Republic", "Purple Lotus Guild", "Guild of St Gregor",
      "Khalmara Guild", "Noble College of Bankers", "Fort Izle Prison", "Church of Alastor", "Culcainian Consulate",
      "Library of Velaria", "Star Sea Trading Company", "Ostral Song", "Zantish Embassy", "Amarantan Embassy",
      "Velarian Army", "The Musician's Guild", "Noctal Song", "Evenstorm Consulate"]],
    ["Industries and companies", ["Sailors", "Ferrymen", "Stonecutters", "Polderfolk", "Underwriters", "Vintners",
      "Chandlers", "Shipwrights", "Scriveners", "Kirkmuir Mechanistic", "Oxbow Holdings"]],
    ["Fringe Factions", ["Red Pilgrims", "The Scattered League", "Broken Tower Guild"]]
  ];
  let favAdd = new Set(), favRemove = new Set();
  let pins = [];
  let territories = [];
  let nextId = 1;
  let nextTerritoryId = 1;
  let hiddenFactions = new Set(); // faction names (or '__none__') currently hidden from the map
  let layersVisible = { pins: false, territories: true, watermarks: true }; // master show/hide per layer type
  // territoryLayer is added first so it sits BELOW markerLayer (Leaflet
  // layers stack in the order they're added to the map).
  const territoryLayer = L.layerGroup().addTo(map);
  const territoryShapes = {};
  const watermarkLayer = L.layerGroup().addTo(map);
  const markerLayer = L.layerGroup().addTo(map);
  const markers = {};

  async function loadPins() {
    let draft = null;
    try { draft = JSON.parse(localStorage.getItem(DRAFT_KEY)); } catch(e) { draft = null; }
    let published = { pins: [], factions: {}, territories: [] };
    try {
      const res = await fetch(PINS_URL, { cache: 'no-store' });
      const data = res.ok ? await res.json() : [];
      // Support both the old plain-array format and the current
      // { pins, factions, territories } format, so an older pins.json still loads.
      published = Array.isArray(data)
        ? { pins: data, factions: {}, territories: [] }
        : { pins: data.pins || [], factions: data.factions || {}, territories: data.territories || [], favourites: Array.isArray(data.favourites) ? data.favourites : null };
    } catch (e) {
      console.warn('Could not fetch pins.json (this is expected if opening the file directly rather than through a local/web server).');
    }
    // If there's a newer unpublished draft sitting in this browser, prefer it.
    if (draft && Array.isArray(draft.pins) && draft.pins.length >= published.pins.length) {
      pins = draft.pins;
      territories = draft.territories || published.territories;
      factionColors = Object.assign({}, FACTIONS_DEFAULT, draft.factions || published.factions);
      defaultFavs = Array.isArray(draft.favourites) ? draft.favourites : (published.favourites || FAVOURITES_FALLBACK.slice());
    } else {
      pins = published.pins;
      territories = published.territories;
      factionColors = Object.assign({}, FACTIONS_DEFAULT, published.factions);
      defaultFavs = published.favourites || FAVOURITES_FALLBACK.slice();
    }
    nextId = pins.reduce((m,p) => Math.max(m, p.id||0), 0) + 1;
    nextTerritoryId = territories.reduce((m,t) => Math.max(m, t.id||0), 0) + 1;

    try {
      hiddenFactions = new Set(JSON.parse(localStorage.getItem(FILTER_KEY)) || []);
    } catch(e) { hiddenFactions = new Set(); }
    try {
      const f = JSON.parse(localStorage.getItem(FAV_KEY)) || {};
      favAdd = new Set(f.add || []); favRemove = new Set(f.remove || []);
    } catch(e) { favAdd = new Set(); favRemove = new Set(); }
  }

  function save() {
    // Draft-only save; does NOT touch the published pins.json.
    localStorage.setItem(DRAFT_KEY, JSON.stringify({ pins, factions: factionColors, territories, favourites: defaultFavs }));
  }

  function factionVisible(faction) {
    return !hiddenFactions.has(faction || '__none__');
  }
  function pinVisible(pin) {
    return layersVisible.pins && factionVisible(pin.faction);
  }
  function territoryVisible(t) {
    return layersVisible.territories && factionVisible(t.faction);
  }

  function renderAll() {
    markerLayer.clearLayers();
    Object.keys(markers).forEach(k => delete markers[k]);
    pins.filter(pinVisible).forEach(addMarker);

    territoryLayer.clearLayers();
    Object.keys(territoryShapes).forEach(k => delete territoryShapes[k]);
    territories.filter(territoryVisible).forEach(addTerritory);
    updateWatermarks();

    renderList();
    renderTerritoryList();
    renderFactionPanel();
  }

  /* ---------- Territory logo watermarks ----------
     Each territory shape gets its faction's logo at the point furthest
     from its edges (so it sits well inside even odd-shaped or concave
     territories). The logo is sized to the shape and the current zoom,
     and left out whenever it would be too small to read — so zooming in
     makes more of them appear. Coordinates here are plain map units, in
     which one unit is the same distance in both directions. */
  const wmCache = {}; // territory id -> { lat, lng, r } (r = clear radius in map units)

  function pointInPoly(x, y, pts) {
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const yi = pts[i][0], xi = pts[i][1], yj = pts[j][0], xj = pts[j][1];
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }
  function distToSegment(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    const len2 = dx * dx + dy * dy;
    let t = len2 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
  }
  function distToEdges(x, y, pts) {
    let best = Infinity;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      best = Math.min(best, distToSegment(x, y, pts[j][1], pts[j][0], pts[i][1], pts[i][0]));
    }
    return best;
  }
  // Approximate "pole of inaccessibility": coarse grid search, then refine.
  function poleOfInaccessibility(pts) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    pts.forEach(p => { minX = Math.min(minX, p[1]); maxX = Math.max(maxX, p[1]); minY = Math.min(minY, p[0]); maxY = Math.max(maxY, p[0]); });
    let best = { x: (minX + maxX) / 2, y: (minY + maxY) / 2, d: -Infinity };
    const consider = (x, y) => {
      const d = (pointInPoly(x, y, pts) ? 1 : -1) * distToEdges(x, y, pts);
      if (d > best.d) best = { x, y, d };
    };
    const N = 24;
    for (let i = 0; i <= N; i++) for (let j = 0; j <= N; j++) {
      consider(minX + (maxX - minX) * i / N, minY + (maxY - minY) * j / N);
    }
    let step = Math.max(maxX - minX, maxY - minY) / N;
    for (let k = 0; k < 6; k++) {
      step /= 2;
      const cx = best.x, cy = best.y;
      for (let dx = -2; dx <= 2; dx++) for (let dy = -2; dy <= 2; dy++) consider(cx + dx * step, cy + dy * step);
    }
    return { lat: best.y, lng: best.x, r: Math.max(best.d, 0) };
  }
  function watermarkSpot(t) {
    if (!wmCache[t.id]) wmCache[t.id] = poleOfInaccessibility(t.points);
    return wmCache[t.id];
  }

  let wmZoom = null; // zoom level the watermarks were last sized for
  function updateWatermarks() {
    watermarkLayer.clearLayers();
    wmZoom = map.getZoom();
    if (!layersVisible.territories || !layersVisible.watermarks) return;
    const pxPerUnit = map.options.crs.scale(map.getZoom());
    territories.filter(territoryVisible).forEach(t => {
      if (!t.faction || t.points.length < 3) return;
      const spot = watermarkSpot(t);
      const size = Math.min(WATERMARK_MAX_PX, spot.r * pxPerUnit * 2 * 0.62);
      if (size < WATERMARK_MIN_PX) return;
      const icon = L.divIcon({
        className: 'territory-logo',
        html: logoImg(t.faction, 'wm-img'),
        iconSize: [size, size],
        iconAnchor: [size / 2, size / 2],
      });
      // Very low z-index offset keeps watermarks underneath every pin.
      L.marker([spot.lat, spot.lng], { icon, interactive: false, keyboard: false, zIndexOffset: -10000000 }).addTo(watermarkLayer);
    });
  }
  map.on('zoomend', updateWatermarks);
  // While a pinch-zoom is in progress, scale the existing watermarks along
  // with the fingers (they're re-sized properly when the zoom settles), so
  // they don't sit at the old size and then snap.
  map.on('zoom', () => {
    if (wmZoom === null) return;
    const k = Math.pow(2, map.getZoom() - wmZoom);
    watermarkLayer.eachLayer(m => {
      const el = m.getElement && m.getElement();
      if (el && el.firstChild) el.firstChild.style.transform = `scale(${k})`;
    });
  });

  function addMarker(pin) {
    const m = L.marker([pin.lat, pin.lng], { icon: pinIcon(pin.faction, pin.name) });
    m.bindPopup(popupHtml(pin));
    m.on('popupopen', () => {
      const editBtn = document.querySelector(`.popup-edit[data-id="${pin.id}"]`);
      if (editBtn) editBtn.onclick = () => { map.closePopup(); openPinModal(pin); };
      const delBtn = document.querySelector(`.popup-del[data-id="${pin.id}"]`);
      if (delBtn) delBtn.onclick = () => deletePin(pin.id);
    });
    m.addTo(markerLayer);
    markers[pin.id] = m;
    return m;
  }

  function popupHtml(pin) {
    const color = (pin.faction && factionColors[pin.faction]) || NO_FACTION_COLOR;
    return `<div class="popup-title">${escapeHtml(pin.name)}</div>
            <div class="popup-cat">${pin.faction ? `${logoImg(pin.faction, 'popup-logo')}<span class="dot" style="background:${color};"></span> ${escapeHtml(pin.faction)}` : 'No faction'}</div>
            ${pin.notes ? `<div class="popup-notes">${escapeHtml(pin.notes)}</div>` : ''}
            ${editMode ? `<div class="popup-actions">
              <button class="popup-edit" data-id="${pin.id}">Edit</button>
              <button class="popup-del" data-id="${pin.id}">Delete</button>
            </div>` : ''}`;
  }

  function escapeHtml(s) {
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function deletePin(id) {
    pins = pins.filter(p => p.id !== id);
    save();
    renderAll();
  }

  function addTerritory(t) {
    const color = factionColors[t.faction] || NO_FACTION_COLOR;
    const poly = L.polygon(t.points, {
      color: color, weight: 1.5, opacity: 0.75,
      fillColor: color, fillOpacity: 0.28,
    });
    poly.bindPopup(`<div class="popup-title">${logoImg(t.faction, 'popup-logo')}${escapeHtml(t.faction)}</div>
      <div class="popup-cat">Territory</div>
      ${editMode ? `<div class="popup-actions"><button class="popup-del" data-territory-id="${t.id}">Delete shape</button></div>` : ''}`);
    poly.on('popupopen', () => {
      const delBtn = document.querySelector(`.popup-del[data-territory-id="${t.id}"]`);
      if (delBtn) delBtn.onclick = () => deleteTerritory(t.id);
    });
    poly.addTo(territoryLayer);
    territoryShapes[t.id] = poly;
    return poly;
  }

  function deleteTerritory(id) {
    territories = territories.filter(t => t.id !== id);
    save();
    renderAll();
  }

/* ================================================================
   5. EDIT-MODE LOCK
   ================================================================ */
  let editMode = false;
  const lockBtn = document.getElementById('lockBtn');

  lockBtn.onclick = () => {
    if (editMode) {
      editMode = false;
      document.body.classList.remove('edit-mode');
      lockBtn.textContent = '🔒';
      lockBtn.classList.remove('unlocked');
      lockBtn.title = 'Unlock editing';
      addMode = false;
      addToggle.classList.remove('active');
      hint.classList.remove('show');
      cancelDrawing();
      map.getContainer().style.cursor = '';
      document.querySelector('.tab-btn[data-tab="factions"]').click();
      renderFactionPanel();
      return;
    }
    const attempt = prompt('Editing passphrase:');
    if (attempt === null) return;
    if (attempt === EDIT_PASSPHRASE) {
      editMode = true;
      document.body.classList.add('edit-mode');
      lockBtn.textContent = '🔓';
      lockBtn.classList.add('unlocked');
      lockBtn.title = 'Lock editing';
      renderAll(); // re-render so delete buttons / popups reflect edit mode
    } else {
      alert('Incorrect passphrase.');
    }
  };

/* ================================================================
   6. ADD-PIN FLOW
   ================================================================ */
  let addMode = false;
  let pendingLatLng = null;
  const addToggle = document.getElementById('addToggle');
  const hint = document.getElementById('hint');

  addToggle.onclick = () => {
    if (!editMode) return;
    addMode = !addMode;
    if (addMode) { cancelDrawing(); if (!layersVisible.pins) setLayer('pins', true); }
    addToggle.classList.toggle('active', addMode);
    hint.classList.toggle('show', addMode);
    map.getContainer().style.cursor = addMode ? 'crosshair' : '';
  };

  map.on('click', (e) => {
    if (!editMode || !addMode) return;
    pendingLatLng = e.latlng;
    openPinModal(null);
  });

  // Opens the pin form. Pass an existing pin object to edit it in place,
  // or null to create a new pin at pendingLatLng.
  function openPinModal(existingPin) {
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    const factionOptions = Object.keys(FACTIONS_DEFAULT).map(name =>
      `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join('');
    backdrop.innerHTML = `
      <div class="modal">
        <h3>${existingPin ? 'Edit Pin' : 'New Pin'}</h3>
        <label>Name</label>
        <input type="text" id="pinName" placeholder="e.g. The Gilded Boar">
        <label>Faction <span style="color:var(--parchment-dim);font-weight:400;">(optional)</span></label>
        <select id="pinFaction">
          <option value="">— No faction —</option>
          ${factionOptions}
        </select>
        <label>Notes</label>
        <textarea id="pinNotes" placeholder="Optional details, hooks, contacts…"></textarea>
        <div class="modal-actions">
          <button class="btn-cancel" id="cancelBtn">Cancel</button>
          <button class="btn-save" id="saveBtn">${existingPin ? 'Save Changes' : 'Save Pin'}</button>
        </div>
      </div>`;
    document.body.appendChild(backdrop);

    const nameInput = backdrop.querySelector('#pinName');
    const factionSelect = backdrop.querySelector('#pinFaction');
    const notesInput = backdrop.querySelector('#pinNotes');
    if (existingPin) {
      nameInput.value = existingPin.name;
      factionSelect.value = existingPin.faction || '';
      notesInput.value = existingPin.notes || '';
    }

    backdrop.querySelector('#cancelBtn').onclick = () => backdrop.remove();
    backdrop.querySelector('#saveBtn').onclick = () => {
      const name = nameInput.value.trim() || 'Unnamed Pin';
      const notes = notesInput.value.trim();
      const faction = factionSelect.value || null;

      if (existingPin) {
        existingPin.name = name;
        existingPin.notes = notes;
        existingPin.faction = faction;
        map.closePopup();
        save();
        renderAll();
      } else {
        const pin = {
          id: nextId++,
          name, notes, faction,
          lat: pendingLatLng.lat, lng: pendingLatLng.lng,
        };
        pins.push(pin);
        save();
        renderAll();
      }
      backdrop.remove();
    };
    backdrop.querySelector('#pinName').focus();
  }

/* ================================================================
   6b. TERRITORY DRAWING
   Click "Draw Territory", pick a faction, then click the map to lay
   down vertices (a dashed preview shows as you go). "Finish shape"
   needs at least 3 points and saves that polygon under the chosen
   faction; the panel stays open so you can start another shape
   right away — factions can have any number of disjoint territories.
   ================================================================ */
  let drawMode = false;
  let drawPoints = [];
  let drawPreview = null;
  const drawToggle = document.getElementById('drawToggle');
  const drawPanel = document.getElementById('drawPanel');
  const drawFactionSelect = document.getElementById('drawFaction');
  const drawStatus = document.getElementById('drawStatus');
  const finishPolygonBtn = document.getElementById('finishPolygonBtn');

  drawFactionSelect.innerHTML = Object.keys(FACTIONS_DEFAULT).map(name =>
    `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join('');

  drawToggle.onclick = () => {
    if (!editMode) return;
    if (drawMode) { cancelDrawing(); return; }
    // Drawing and pin-dropping are mutually exclusive map-click modes.
    if (addMode) {
      addMode = false;
      addToggle.classList.remove('active');
      hint.classList.remove('show');
    }
    drawMode = true;
    if (!layersVisible.territories) setLayer('territories', true);
    drawPoints = [];
    drawToggle.classList.add('active');
    drawPanel.style.display = 'block'; drawPanel.classList.add('open');
    map.doubleClickZoom.disable();
    map.getContainer().style.cursor = 'crosshair';
    updateDrawPreview();
  };

  drawFactionSelect.onchange = updateDrawPreview;

  map.on('click', (e) => {
    if (!drawMode) return;
    drawPoints.push(e.latlng);
    updateDrawPreview();
  });

  function updateDrawPreview() {
    drawStatus.textContent = `${drawPoints.length} point${drawPoints.length === 1 ? '' : 's'} placed`;
    finishPolygonBtn.disabled = drawPoints.length < 3;
    if (drawPreview) { map.removeLayer(drawPreview); drawPreview = null; }
    if (drawPoints.length < 2) return;
    const color = factionColors[drawFactionSelect.value] || NO_FACTION_COLOR;
    drawPreview = L.polygon(drawPoints, {
      color: color, weight: 2, dashArray: '5,5',
      fillColor: color, fillOpacity: 0.2,
    }).addTo(map);
  }

  document.getElementById('undoPointBtn').onclick = () => {
    drawPoints.pop();
    updateDrawPreview();
  };

  document.getElementById('cancelPolygonBtn').onclick = () => cancelDrawing();

  finishPolygonBtn.onclick = () => {
    if (drawPoints.length < 3) return;
    const territory = {
      id: nextTerritoryId++,
      faction: drawFactionSelect.value,
      points: drawPoints.map(p => [p.lat, p.lng]),
    };
    territories.push(territory);
    save();
    drawPoints = [];
    updateDrawPreview();
    renderAll(); // draws the finished shape and refreshes the Territory tab
  };

  function cancelDrawing() {
    drawMode = false;
    drawPoints = [];
    if (drawPreview) { map.removeLayer(drawPreview); drawPreview = null; }
    drawToggle.classList.remove('active');
    drawPanel.style.display = 'none'; drawPanel.classList.remove('open');
    map.doubleClickZoom.enable();
    map.getContainer().style.cursor = '';
  }

  function renderTerritoryList() {
    const list = territories.filter(territoryVisible);
    const el = document.getElementById('territoryPanel');
    el.innerHTML = '';
    if (!list.length) {
      const msg = territories.length ? 'All territory shapes are hidden — check the Factions tab.' :
        (editMode ? 'No shapes yet. Click "Draw Territory" above the map, pick a faction, then click the map to place vertices.' : 'No territory published yet.');
      el.innerHTML = `<div class="empty-note">${msg}</div>`;
      return;
    }
    list.forEach(t => {
      const color = factionColors[t.faction] || NO_FACTION_COLOR;
      const row = document.createElement('div');
      row.className = 'territory-row';
      row.innerHTML = `<span class="swatch" style="background:${color};"></span>
        <div class="pin-row-text">${escapeHtml(t.faction)}</div>
        ${editMode ? `<button class="pin-row-del" data-territory-id="${t.id}" title="Delete">×</button>` : ''}`;
      row.querySelector('.pin-row-text').onclick = () => {
        const shape = territoryShapes[t.id];
        if (shape) { map.fitBounds(shape.getBounds(), { maxZoom: MAX_NATIVE_ZOOM }); shape.openPopup(); }
      };
      const delBtn = row.querySelector('.pin-row-del');
      if (delBtn) delBtn.onclick = (e) => { e.stopPropagation(); deleteTerritory(t.id); };
      el.appendChild(row);
    });
  }

/* ================================================================
   7. SIDEBAR LIST + SEARCH
   ================================================================ */
  const pinListEl = document.getElementById('pinList');
  const pinCountEl = document.getElementById('pinCount');

  function renderList(filter) {
    const visiblePins = pins.filter(pinVisible);
    const list = filter
      ? visiblePins.filter(p => p.name.toLowerCase().includes(filter.toLowerCase()))
      : visiblePins;
    pinListEl.innerHTML = '';
    if (!list.length) {
      const emptyMsg = visiblePins.length ? 'No pins match your search.' :
        (pins.length ? (layersVisible.pins ? 'All pins are hidden — check the Factions tab.' : 'Pins are switched off to keep the map uncluttered. Turn them on with the <b>Layers</b> button (bottom left).') :
        (editMode ? 'No pins yet. Click "Drop Pin", then click anywhere on the map.' : 'No pins published yet.'));
      pinListEl.innerHTML = `<div class="empty-note">${emptyMsg}</div>`;
      return;
    }
    list.forEach(pin => {
      const color = (pin.faction && factionColors[pin.faction]) || NO_FACTION_COLOR;
      const row = document.createElement('div');
      row.className = 'pin-row';
      row.innerHTML = `<span class="dot" style="background:${color};margin-top:4px;"></span>
        <div class="pin-row-text">
          <div class="pin-row-name">${escapeHtml(pin.name)}</div>
          <div class="pin-row-cat">${pin.faction ? escapeHtml(pin.faction) : 'No faction'}</div>
        </div>
        ${editMode ? `<button class="pin-row-del" data-id="${pin.id}" title="Delete">×</button>` : ''}`;
      row.querySelector('.pin-row-text').onclick = () => flyToPin(pin);
      row.querySelector('.dot').onclick = () => flyToPin(pin);
      const delBtn = row.querySelector('.pin-row-del');
      if (delBtn) delBtn.onclick = (e) => { e.stopPropagation(); deletePin(pin.id); };
      pinListEl.appendChild(row);
    });
  }

  function flyToPin(pin) {
    if (!layersVisible.pins) setLayer('pins', true); // listing a pin means the user wants to see it
    map.flyTo([pin.lat, pin.lng], Math.max(map.getZoom(), MAX_NATIVE_ZOOM - 1));
    setTimeout(() => markers[pin.id] && markers[pin.id].openPopup(), 400);
  }

  const searchInput = document.getElementById('searchInput');
  const searchResults = document.getElementById('searchResults');
  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim();
    if (!q) { searchResults.style.display = 'none'; return; }
    const matches = pins.filter(pinVisible).filter(p => p.name.toLowerCase().includes(q.toLowerCase())).slice(0, 8);
    if (!matches.length) { searchResults.style.display = 'none'; return; }
    searchResults.innerHTML = '';
    matches.forEach(pin => {
      const color = (pin.faction && factionColors[pin.faction]) || NO_FACTION_COLOR;
      const btn = document.createElement('button');
      btn.innerHTML = `<span class="dot" style="background:${color};"></span>${escapeHtml(pin.name)}`;
      btn.onclick = () => { flyToPin(pin); searchResults.style.display = 'none'; searchInput.value = pin.name; };
      searchResults.appendChild(btn);
    });
    searchResults.style.display = 'block';
  });
  document.addEventListener('click', (e) => {
    if (!searchResults.contains(e.target) && e.target !== searchInput) searchResults.style.display = 'none';
  });

/* ================================================================
   7b. TABS + FACTIONS PANEL
   Visibility checkboxes are available to everyone (this is just a
   personal view filter, remembered in your own browser). Colour
   pickers only appear once editing is unlocked, since a colour
   change is a real edit that needs publishing to take effect for
   everyone else.
   ================================================================ */
  const TAB_PANELS = { pins: 'pinList', territory: 'territoryPanel', factions: 'factionList' };
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(TAB_PANELS[btn.dataset.tab]).classList.add('active');
    };
  });

  const factionListEl = document.getElementById('factionList');

  // Favourites = the published list, plus anything this player starred, minus anything they un-starred.
  // While editing, the star changes the published list itself (the one everybody gets after you Publish).
  function isFavourite(key) {
    if (editMode) return defaultFavs.includes(key);
    return (defaultFavs.includes(key) || favAdd.has(key)) && !favRemove.has(key);
  }
  function toggleFavourite(key) {
    if (editMode) {
      defaultFavs = isFavourite(key) ? defaultFavs.filter(k => k !== key) : defaultFavs.concat(key);
      save();
    } else if (isFavourite(key)) {
      favAdd.delete(key);
      if (defaultFavs.includes(key)) favRemove.add(key);
    } else {
      favRemove.delete(key);
      if (!defaultFavs.includes(key)) favAdd.add(key);
    }
    if (!editMode) {
      try { localStorage.setItem(FAV_KEY, JSON.stringify({ add: [...favAdd], remove: [...favRemove] })); } catch(e) {}
    }
    renderFactionPanel();
  }
  function resetFavourites() {
    favAdd.clear(); favRemove.clear();
    try { localStorage.removeItem(FAV_KEY); } catch(e) {}
    renderFactionPanel();
  }

  function renderFactionPanel() {
    const keepScroll = factionListEl.scrollTop;
    const names = Object.keys(FACTIONS_DEFAULT);
    const rows = [{ key: '__none__', label: 'No faction', color: NO_FACTION_COLOR, editableColor: false }]
      .concat(names.map(n => ({ key: n, label: n, color: factionColors[n], editableColor: true })));

    factionListEl.innerHTML = `
      <div class="faction-filter-actions">
        <button id="showAllFactions">Show all</button>
        <button id="hideAllFactions">Hide all</button>
      </div>`;

    const shown = rows.filter(r => !hiddenFactions.has(r.key)).length;
    pinCountEl.textContent = `${shown} of ${rows.length} shown`;

    const buildRow = (row) => {
      const wrap = document.createElement('div');
      wrap.className = 'faction-row';
      wrap.innerHTML = `
        <input type="checkbox" ${hiddenFactions.has(row.key) ? '' : 'checked'}>
        ${row.editableColor
          ? `<input type="color" class="edit-only" value="${row.color}">`
          : `<span class="dot" style="background:${row.color};"></span>`}
        <span class="mini-slot">${row.editableColor ? logoImg(row.key, 'mini-logo') : ''}</span>
        <span class="faction-name">${escapeHtml(row.label)}</span>
        ${row.editableColor ? `<button class="fav-btn ${isFavourite(row.key) ? 'on' : ''}" aria-pressed="${isFavourite(row.key)}" title="${isFavourite(row.key) ? 'Remove from favourites' : 'Add to favourites'}">${isFavourite(row.key) ? '★' : '☆'}</button>` : ''}`;

      wrap.querySelector('input[type=checkbox]').onchange = (e) => {
        if (e.target.checked) hiddenFactions.delete(row.key);
        else hiddenFactions.add(row.key);
        localStorage.setItem(FILTER_KEY, JSON.stringify([...hiddenFactions]));
        renderAll();
      };

      const colorInput = wrap.querySelector('input[type=color]');
      if (colorInput) {
        colorInput.oninput = () => {
          factionColors[row.key] = colorInput.value;
          save();
          markerLayer.clearLayers();
          Object.keys(markers).forEach(k => delete markers[k]);
          pins.filter(pinVisible).forEach(addMarker);
          territoryLayer.clearLayers();
          Object.keys(territoryShapes).forEach(k => delete territoryShapes[k]);
          territories.filter(territoryVisible).forEach(addTerritory);
          // Don't call renderFactionPanel() here — it would rebuild the
          // colour input mid-drag. The swatch itself already shows the
          // live colour via the native picker.
        };
      }
      const favBtn = wrap.querySelector('.fav-btn');
      if (favBtn) favBtn.onclick = (e) => { e.preventDefault(); e.stopPropagation(); toggleFavourite(row.key); };
      factionListEl.appendChild(wrap);
    };

    const heading = (text, extraHtml) => {
      const h = document.createElement('div');
      h.className = 'faction-group-head';
      h.innerHTML = `<span>${text}</span>${extraHtml || ''}`;
      factionListEl.appendChild(h);
      return h;
    };
    const favRows = rows.filter(r => r.editableColor && isFavourite(r.key));
    const otherRows = rows.filter(r => !(r.editableColor && isFavourite(r.key)));
    if (favRows.length) {
      const dirty = !editMode && (favAdd.size || favRemove.size);
      const h = heading(editMode ? '★ Favourites — shown to everyone' : '★ Favourites',
        dirty ? '<button class="fav-reset" title="Go back to the standard favourites">Reset</button>' : '');
      const rb = h.querySelector('.fav-reset'); if (rb) rb.onclick = resetFavourites;
      favRows.forEach(buildRow);
      heading('All factions');
    }
    otherRows.filter(r => !r.editableColor).forEach(buildRow); // "No faction"
    const grouped = new Set();
    FACTION_GROUPS.forEach(([title, members]) => {
      const inGroup = members.map(m => otherRows.find(r => r.key === m)).filter(Boolean);
      members.forEach(m => grouped.add(m));
      if (inGroup.length) { heading(title); inGroup.forEach(buildRow); }
    });
    const leftover = otherRows.filter(r => r.editableColor && !grouped.has(r.key));
    if (leftover.length) { heading('Other'); leftover.forEach(buildRow); }
    factionListEl.scrollTop = keepScroll;

    document.getElementById('showAllFactions').onclick = () => {
      hiddenFactions.clear();
      localStorage.setItem(FILTER_KEY, JSON.stringify([...hiddenFactions]));
      renderAll();
    };
    document.getElementById('hideAllFactions').onclick = () => {
      hiddenFactions = new Set(['__none__', ...Object.keys(FACTIONS_DEFAULT)]);
      localStorage.setItem(FILTER_KEY, JSON.stringify([...hiddenFactions]));
      renderAll();
    };
  }

/* ================================================================
   8. SIDEBAR COLLAPSE, PUBLISH / LOAD
   ================================================================ */
  const sidebar = document.getElementById('sidebar');
  document.getElementById('sidebarToggle').onclick = () => {
    sidebar.classList.toggle('collapsed');
    syncSidebarArrow();
  };
  function syncSidebarArrow() {
    document.querySelector('#sidebarToggle .st-arrow').textContent = sidebar.classList.contains('collapsed') ? '‹' : '›';
  }
  // On phones the panel would cover most of the map, so start with it tucked away.
  if (window.innerWidth < 700) { sidebar.classList.add('collapsed'); syncSidebarArrow(); }

  // Downloads the current pins, faction colours, and territory shapes
  // as pins.json. Replace the file of the same name on your host
  // (GitHub repo / Netlify folder) to make these visible to everyone
  // else who opens the map.
  document.getElementById('publishBtn').onclick = () => {
    const blob = new Blob([JSON.stringify({ pins, factions: factionColors, territories, favourites: defaultFavs }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'pins.json';
    a.click();
  };
  document.getElementById('importFile').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const imported = JSON.parse(reader.result);
        const data = Array.isArray(imported)
          ? { pins: imported, factions: {}, territories: [] }
          : { pins: imported.pins || [], factions: imported.factions || {}, territories: imported.territories || [] };
        defaultFavs = Array.isArray(imported.favourites) ? imported.favourites : defaultFavs;
        pins = data.pins;
        territories = data.territories;
        factionColors = Object.assign({}, FACTIONS_DEFAULT, data.factions);
        nextId = pins.reduce((m,p) => Math.max(m, p.id||0), 0) + 1;
        nextTerritoryId = territories.reduce((m,t) => Math.max(m, t.id||0), 0) + 1;
        save();
        renderAll();
      } catch(err) { alert('Could not read that file — is it a pins.json from this map?'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  };
  document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();

/* ================================================================
   8b. LAYERS SHORTCUT (bottom-left) — mirrors the sidebar toggles
   ================================================================ */
  const layersBtn = document.getElementById('layersBtn');
  const layersPanel = document.getElementById('layersPanel');

  function syncLayerControls() {
    layersPanel.querySelectorAll('.layer-row').forEach(row => {
      const on = !!layersVisible[row.dataset.layer];
      row.setAttribute('aria-checked', on);
      if (row.dataset.layer === 'watermarks') row.classList.toggle('disabled', !layersVisible.territories);
    });
  }
  function setLayer(name, on) {
    layersVisible[name] = on;
    syncLayerControls();
    if (name === 'watermarks') updateWatermarks(); else renderAll();
  }
  layersPanel.querySelectorAll('.layer-row').forEach(row => {
    row.onclick = () => setLayer(row.dataset.layer, !layersVisible[row.dataset.layer]);
  });
  function toggleLayersPanel(open) {
    layersPanel.hidden = !open;
    layersBtn.setAttribute('aria-expanded', open);
  }
  layersBtn.onclick = (e) => { e.stopPropagation(); toggleLayersPanel(layersPanel.hidden); };
  document.addEventListener('click', (e) => { if (!layersPanel.hidden && !document.getElementById('layersCtl').contains(e.target)) toggleLayersPanel(false); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') toggleLayersPanel(false); });
  L.DomEvent.disableClickPropagation(document.getElementById('layersCtl'));
  L.DomEvent.disableScrollPropagation(document.getElementById('layersCtl'));
  syncLayerControls();

/* ================================================================
   9. COMPASS CONTROL
   ================================================================ */
  document.querySelector('.compass .zin').onclick = () => map.zoomIn();
  document.querySelector('.compass .zout').onclick = () => map.zoomOut();
  document.querySelector('.compass .reset').onclick = () => { map.setBearing(0); map.fitBounds(bounds); };

  // Rotation buttons. The map's bearing is the compass heading shown at
  // the top of the screen, so the needle turns the opposite way to keep
  // pointing at the map's original "up". Rotation is a personal view
  // setting only — it isn't saved in pins.json.
  const ROTATE_STEP = 15; // degrees per button press
  const northNeedle = document.getElementById('northNeedle');
  function currentBearing() { return map.getBearing ? map.getBearing() : 0; }
  document.getElementById('rotLeft').onclick  = () => map.setBearing(currentBearing() - ROTATE_STEP);
  document.getElementById('rotRight').onclick = () => map.setBearing(currentBearing() + ROTATE_STEP);
  document.getElementById('rotNorth').onclick = () => map.setBearing(0);
  map.on('rotate', () => {
    northNeedle.style.transform = `rotate(${-currentBearing()}deg)`;
  });

/* ================================================================
   10. INITIAL LOAD
   ================================================================ */
  loadPins().then(renderAll);
</script>
</body>
</html>
